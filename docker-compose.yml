services:
  # ---------------------------------------------------------------- BASE DE DATOS
  db:
    image: mariadb:11.4
    container_name: entrecol_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: America/Bogota
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------- API
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: entrecol_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Solo se pasan las variables que la API necesita (NO la contraseña root).
    environment:
      DB_HOST: db            # nombre del servicio de arriba, no "localhost"
      DB_PORT: "3306"        # puerto INTERNO del contenedor (no el publicado)
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      COOKIE_SECURE: "true"
      TZ: America/Bogota
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./docs/bases_de_datos_iniciales:/data:ro,Z   # datos de la empresa (solo lectura)

volumes:
  db_data:
