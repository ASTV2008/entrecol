services:
  # ---------------------------------------------------------------- BASE DE DATOS
  db:
    image: mariadb:11.4
    container_name: entrecol_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: America/Bogota
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------- API
  api:
    build: ./backend
    container_name: entrecol_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Solo se pasan las variables que la API necesita (NO la contraseña root).
    environment:
      DB_HOST: db            # nombre del servicio de arriba, no "localhost"
      DB_PORT: "3306"        # puerto INTERNO del contenedor (no el publicado)
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app:Z     # el código editado en tu PC se ve dentro del contenedor
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data:
